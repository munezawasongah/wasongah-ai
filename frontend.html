<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0a0a0f">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>WasongahAI — Your Workspace</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Instrument+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0a0a0f;--surface:#111118;--surface2:#1a1a24;--surface3:#22222f;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#f0f0f8;--muted:#6b6b80;--muted2:#9090a8;
  --cyan:#00e5ff;--cyan-dim:rgba(0,229,255,0.12);--cyan-glow:rgba(0,229,255,0.25);
  --violet:#a855f7;--violet-dim:rgba(168,85,247,0.12);
  --green:#22c55e;--green-dim:rgba(34,197,94,0.12);
  --amber:#f59e0b;--amber-dim:rgba(245,158,11,0.12);
  --pink:#ec4899;--pink-dim:rgba(236,72,153,0.12);
  --red:#ef4444;--red-dim:rgba(239,68,68,0.12);
  --orange:#f97316;--orange-dim:rgba(249,115,22,0.12);
  --sans:'Instrument Sans',sans-serif;--display:'Syne',sans-serif;--mono:'JetBrains Mono',monospace;
  --r:12px;--r-sm:8px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;overflow:hidden}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,229,255,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,0.025) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}

/* AUTH SCREEN */
.auth-screen{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:1rem}
.auth-screen.hidden{display:none}
.auth-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border2);border-radius:16px;padding:2.5rem 2rem;position:relative;z-index:1}
.auth-logo{font-family:var(--display);font-size:1.6rem;font-weight:800;text-align:center;margin-bottom:0.3rem}
.auth-logo em{color:var(--cyan);font-style:normal}
.auth-tagline{text-align:center;font-size:13px;color:var(--muted2);margin-bottom:2rem}
.auth-tabs{display:flex;background:var(--surface2);border-radius:var(--r-sm);padding:4px;gap:4px;margin-bottom:1.5rem}
.auth-tab{flex:1;padding:8px;border:none;border-radius:6px;font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;transition:all 0.15s;color:var(--muted2);background:transparent}
.auth-tab.active{background:var(--surface3);color:var(--text)}
.auth-field{margin-bottom:14px}
.auth-field label{display:block;font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted2);margin-bottom:5px}
.auth-field input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--r-sm);padding:10px 12px;font-family:var(--sans);font-size:13.5px;color:var(--text);outline:none;transition:border-color 0.15s}
.auth-field input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px var(--cyan-dim)}
.auth-btn{width:100%;background:var(--cyan);border:none;border-radius:var(--r-sm);padding:12px;font-family:var(--display);font-size:1rem;font-weight:700;color:#000;cursor:pointer;transition:all 0.15s;margin-top:6px}
.auth-btn:hover{background:#33eaff;box-shadow:0 0 20px var(--cyan-glow)}
.auth-btn:disabled{opacity:0.5;cursor:not-allowed}
.auth-msg{font-size:12px;padding:10px 12px;border-radius:var(--r-sm);margin-bottom:12px;display:none}
.auth-msg.error{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#fca5a5;display:block}
.auth-msg.success{background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);color:#86efac;display:block}
.auth-divider{text-align:center;font-size:12px;color:var(--muted);margin:14px 0}
.auth-free-badge{text-align:center;font-size:12px;color:var(--green);margin-top:14px;background:var(--green-dim);padding:8px;border-radius:var(--r-sm);border:1px solid rgba(34,197,94,0.2)}
.forgot-link{display:block;text-align:right;font-size:12px;color:var(--muted2);cursor:pointer;margin-top:-8px;margin-bottom:10px}
.forgot-link:hover{color:var(--cyan)}

/* HEADER */
header{position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;height:56px;border-bottom:1px solid var(--border);background:rgba(10,10,15,0.9);backdrop-filter:blur(12px)}
.logo{font-family:var(--display);font-size:1.15rem;font-weight:800;letter-spacing:-0.02em}
.logo em{color:var(--cyan);font-style:normal}
.header-right{display:flex;align-items:center;gap:10px}
.credit-badge{display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.15s}
.credit-badge:hover{border-color:var(--amber)}
.credit-icon{color:var(--amber)}
.credit-count{color:var(--text)}
.user-menu-btn{width:34px;height:34px;border-radius:50%;background:var(--violet-dim);border:1px solid var(--violet);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;cursor:pointer;color:var(--violet);position:relative}
.user-dropdown{position:absolute;top:calc(100% + 8px);right:0;background:var(--surface);border:1px solid var(--border2);border-radius:var(--r);padding:8px;width:200px;display:none;z-index:100}
.user-dropdown.open{display:block}
.user-dropdown-name{padding:8px 10px;font-size:12px;color:var(--muted2);border-bottom:1px solid var(--border);margin-bottom:6px}
.user-dropdown-name strong{display:block;color:var(--text);font-size:13px;margin-bottom:2px}
.dditem{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;font-size:13px;color:var(--muted2);cursor:pointer;transition:all 0.15s;width:100%;border:none;background:transparent;font-family:var(--sans);text-align:left}
.dditem:hover{background:var(--surface2);color:var(--text)}
.dditem.danger:hover{color:#fca5a5;background:var(--red-dim)}

/* SHELL */
.shell{display:flex;flex:1;overflow:hidden;position:relative;z-index:1}

/* SIDEBAR */
.sidebar{width:240px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;padding:1rem 0.75rem;gap:2px}
.sidebar-label{font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);padding:8px 8px 6px;margin-top:8px}
.sidebar-label:first-child{margin-top:0}
.tool-btn{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:none;border-radius:var(--r-sm);background:transparent;color:var(--muted2);font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;text-align:left;transition:all 0.15s;position:relative}
.tool-btn:hover{background:var(--surface2);color:var(--text)}
.tool-btn.active{background:var(--surface2);color:var(--text)}
.tool-btn.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:18px;border-radius:0 3px 3px 0;background:var(--accent,var(--cyan))}
.tool-icon{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;background:var(--icon-bg,var(--cyan-dim))}
.tool-cost{margin-left:auto;font-size:10px;color:var(--muted);background:var(--surface3);border-radius:4px;padding:2px 5px}
.sidebar-buy-btn{margin:8px;background:linear-gradient(135deg,var(--amber),#e67e22);border:none;border-radius:var(--r-sm);padding:10px;font-family:var(--display);font-size:0.85rem;font-weight:700;color:#000;cursor:pointer;width:calc(100% - 16px);transition:all 0.15s}
.sidebar-buy-btn:hover{opacity:0.9;transform:translateY(-1px)}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.tool-header{padding:1.2rem 1.5rem;border-bottom:1px solid var(--border);background:rgba(10,10,15,0.6);backdrop-filter:blur(8px);display:flex;align-items:center;gap:12px}
.tool-header-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.tool-header-title{font-family:var(--display);font-size:1.05rem;font-weight:700}
.tool-header-desc{font-size:12px;color:var(--muted2);margin-top:2px}
.workspace{flex:1;display:flex;overflow:hidden}
.input-col{flex:1;display:flex;flex-direction:column;padding:1.25rem;gap:12px;border-right:1px solid var(--border);overflow-y:auto}
.output-col{flex:1;display:flex;flex-direction:column;overflow:hidden}
.output-header{padding:10px 1.25rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted)}
.output-content{flex:1;overflow-y:auto;padding:1.25rem}

/* FORM */
label{display:block;font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted2);margin-bottom:6px}
textarea,input[type=text],select{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--r-sm);padding:10px 12px;font-family:var(--sans);font-size:13.5px;color:var(--text);outline:none;transition:border-color 0.15s;resize:vertical}
textarea:focus,input:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px var(--cyan-dim)}
textarea{min-height:120px;line-height:1.6}
select option{background:var(--surface2)}
.options-row{display:flex;gap:8px;flex-wrap:wrap}
.opt-chip{background:var(--surface2);border:1px solid var(--border2);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:500;color:var(--muted2);cursor:pointer;transition:all 0.15s;font-family:var(--sans)}
.opt-chip:hover{border-color:var(--cyan);color:var(--text)}
.opt-chip.active{background:var(--cyan-dim);border-color:var(--cyan);color:var(--cyan)}
.run-btn{width:100%;background:var(--cyan);color:#000;border:none;border-radius:var(--r-sm);padding:12px;font-family:var(--display);font-size:0.95rem;font-weight:700;cursor:pointer;transition:all 0.15s}
.run-btn:hover{background:#33eaff;box-shadow:0 0 20px var(--cyan-glow)}
.run-btn:disabled{opacity:0.4;cursor:not-allowed}

/* OUTPUT */
.out-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:10px;text-align:center;padding:2rem}
.out-loading{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted2)}
.loader-ring{width:36px;height:36px;border:2px solid var(--border2);border-top-color:var(--cyan);border-radius:50%;animation:spin 0.7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.out-result{font-size:14px;line-height:1.8;color:var(--text);white-space:pre-wrap;word-break:break-word}
.code-block{font-family:var(--mono);background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px 14px;display:block;font-size:12.5px;margin:10px 0;overflow-x:auto;white-space:pre}
.copy-btn{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--r-sm);padding:5px 12px;font-family:var(--sans);font-size:11px;font-weight:600;color:var(--muted2);cursor:pointer;transition:all 0.15s}
.copy-btn:hover{border-color:var(--cyan);color:var(--cyan)}
.credits-used-tag{font-size:11px;color:var(--amber);background:var(--amber-dim);padding:4px 10px;border-radius:20px;border:1px solid rgba(245,158,11,0.2)}

/* CHAT */
.chat-wrapper{flex:1;display:flex;flex-direction:column;overflow:hidden}
.chat-msgs{flex:1;overflow-y:auto;padding:1.25rem;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;flex-direction:column;gap:4px;max-width:80%}
.msg.user{align-self:flex-end}
.msg.ai{align-self:flex-start}
.msg-name{font-size:10px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted)}
.msg-bubble{padding:10px 14px;border-radius:12px;font-size:13.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.msg.user .msg-bubble{background:var(--cyan);color:#000;border-radius:14px 14px 4px 14px}
.msg.ai .msg-bubble{background:var(--surface2);border:1px solid var(--border2);color:var(--text);border-radius:4px 14px 14px 14px}
.chat-input-bar{display:flex;gap:10px;padding:1rem 1.25rem;border-top:1px solid var(--border);background:var(--surface)}
.chat-text{flex:1;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--r-sm);padding:10px 14px;font-family:var(--sans);font-size:13.5px;color:var(--text);outline:none}
.chat-text:focus{border-color:var(--cyan)}
.chat-send{background:var(--cyan);border:none;border-radius:var(--r-sm);width:40px;height:40px;color:#000;font-size:16px;cursor:pointer;transition:background 0.15s;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chat-send:hover{background:#33eaff}
.chat-send:disabled{opacity:0.4;cursor:not-allowed}

/* BUY CREDITS MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:500;display:flex;align-items:center;justify-content:center;padding:1rem;backdrop-filter:blur(4px)}
.modal-overlay.hidden{display:none}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:16px;padding:2rem;width:100%;max-width:560px;max-height:90vh;overflow-y:auto}
.modal-title{font-family:var(--display);font-size:1.3rem;font-weight:700;margin-bottom:0.3rem}
.modal-sub{font-size:13px;color:var(--muted2);margin-bottom:1.5rem}
.packages-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:1.5rem}
.pkg-card{background:var(--surface2);border:1.5px solid var(--border2);border-radius:var(--r);padding:1rem;cursor:pointer;transition:all 0.15s;position:relative;text-align:center}
.pkg-card:hover{border-color:var(--amber)}
.pkg-card.selected{border-color:var(--amber);background:var(--amber-dim)}
.pkg-popular{position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--amber);color:#000;font-size:9px;font-weight:700;padding:2px 8px;border-radius:10px;letter-spacing:0.06em;white-space:nowrap}
.pkg-name{font-size:12px;font-weight:600;color:var(--muted2);margin-bottom:4px}
.pkg-credits{font-family:var(--display);font-size:1.4rem;font-weight:700;color:var(--text)}
.pkg-credits span{font-size:11px;color:var(--muted);font-family:var(--sans);font-weight:400}
.pkg-price{font-size:11px;color:var(--amber);margin-top:4px}
.pay-tabs{display:flex;gap:8px;margin-bottom:1rem}
.pay-tab{flex:1;padding:9px;border-radius:var(--r-sm);border:1px solid var(--border2);background:var(--surface2);font-family:var(--sans);font-size:13px;font-weight:600;color:var(--muted2);cursor:pointer;transition:all 0.15s;text-align:center}
.pay-tab.active{border-color:var(--cyan);color:var(--cyan);background:var(--cyan-dim)}
.pay-panel{display:none}
.pay-panel.active{display:block}
.pay-field{margin-bottom:12px}
.pay-field label{display:block;font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted2);margin-bottom:5px}
.pay-field input{width:100%;background:var(--surface3);border:1px solid var(--border2);border-radius:var(--r-sm);padding:10px 12px;font-family:var(--sans);font-size:13.5px;color:var(--text);outline:none;transition:border-color 0.15s}
.pay-field input:focus{border-color:var(--cyan)}
.pay-btn{width:100%;padding:12px;border:none;border-radius:var(--r-sm);font-family:var(--display);font-size:0.95rem;font-weight:700;cursor:pointer;transition:all 0.15s;margin-top:4px}
.pay-btn.mpesa{background:#00b050;color:#fff}
.pay-btn.mpesa:hover{background:#009040}
.pay-btn.stripe{background:var(--violet);color:#fff}
.pay-btn.stripe:hover{background:#9333ea}
.pay-btn:disabled{opacity:0.5;cursor:not-allowed}
.modal-close{position:absolute;top:1rem;right:1rem;background:var(--surface2);border:1px solid var(--border2);border-radius:6px;padding:4px 10px;font-size:12px;color:var(--muted2);cursor:pointer}
.modal-close:hover{color:var(--text)}
.payment-status{padding:12px;border-radius:var(--r-sm);margin-top:10px;font-size:13px;display:none}
.payment-status.checking{background:var(--cyan-dim);border:1px solid rgba(0,229,255,0.3);color:var(--cyan);display:block}
.payment-status.success{background:var(--green-dim);border:1px solid rgba(34,197,94,0.3);color:#86efac;display:block}
.payment-status.failed{background:var(--red-dim);border:1px solid rgba(239,68,68,0.3);color:#fca5a5;display:block}

/* IMAGE UPLOAD */
.upload-zone{border:2px dashed var(--border2);border-radius:var(--r);padding:2rem;text-align:center;cursor:pointer;transition:all 0.15s;color:var(--muted2);font-size:13px}
.upload-zone:hover{border-color:var(--cyan);color:var(--text)}
.upload-zone input{display:none}
.preview-img{width:100%;border-radius:var(--r-sm);border:1px solid var(--border2);margin-top:10px;max-height:200px;object-fit:contain}

::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:10px}

@media(max-width:768px){.sidebar{width:56px}.sidebar-label,.tool-btn span,.tool-cost,.sidebar-buy-btn{display:none}.tool-icon{margin:auto}.workspace{flex-direction:column}.input-col{border-right:none;border-bottom:1px solid var(--border)}}

/* ── LAYOUT FIX: scrolling + mobile viewport ── */
html,body{height:100%}
body{height:100vh;height:100dvh;min-height:0}
.shell,.main,.workspace,.output-col,.input-col,.chat-wrapper,#toolBody,#mainArea,.chat-msgs,.output-content{min-height:0;min-width:0}
.main{overflow:hidden}
.chat-wrapper{height:100%}
.chat-msgs{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.chat-input-bar{flex-shrink:0;padding-bottom:calc(1rem + env(safe-area-inset-bottom,0px))}
.chat-text{min-width:0}
@media(max-width:768px){
  .sidebar{width:56px;padding:.75rem .4rem}
  .tool-header{padding:.75rem 1rem}
  .tool-header-desc{display:none}
  .workspace{flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .input-col{flex:none;overflow:visible}
  .output-col{flex:none;min-height:55dvh}
  .output-content{overflow:visible}
  .chat-text,textarea,input[type=text],select{font-size:16px}
  .chat-input-bar{padding:.6rem .75rem calc(.6rem + env(safe-area-inset-bottom,0px))}
  .chat-msgs{padding:.9rem}
  .chat-send{width:44px;height:44px}
}
.spinner{width:34px;height:34px;border:3px solid var(--border2);border-top-color:var(--cyan);border-radius:50%;animation:vspin .9s linear infinite}
@keyframes vspin{to{transform:rotate(360deg)}}

/* ── CHAT EXTRAS ── */
.msg-bubble code.inline{font-family:var(--mono);font-size:12.5px;background:var(--surface3);padding:1px 5px;border-radius:4px}
.chat-top{display:flex;align-items:center;gap:8px;padding:8px 1rem;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;overflow-x:auto}
.chat-top-btn{background:var(--surface2);border:1px solid var(--border2);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:500;color:var(--muted2);cursor:pointer;font-family:var(--sans);white-space:nowrap}
.chat-top-btn:hover{border-color:var(--cyan);color:var(--text)}
.chat-top-btn.on{background:var(--cyan-dim);border-color:var(--cyan);color:var(--cyan)}
#chatLang{width:auto;padding:5px 8px;font-size:12px;border-radius:20px;resize:none}
.hist-panel{position:absolute;top:44px;left:1rem;z-index:20;width:min(320px,calc(100% - 2rem));max-height:60%;overflow-y:auto;background:var(--surface);border:1px solid var(--border2);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.hist-item{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--border)}
.hist-item:hover,.hist-item.active{background:var(--surface2)}
.hist-title{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-date{font-size:11px;color:var(--muted)}
.hist-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;padding:4px}
.hist-del:hover{color:#fca5a5}
.hist-clear{width:100%;background:none;border:none;color:var(--muted2);font-size:12px;padding:10px;cursor:pointer;font-family:var(--sans)}
.hist-clear:hover{color:#fca5a5}
.attach-row{padding:6px 1.25rem 0;background:var(--surface);flex-shrink:0}
.attach-chip{display:inline-flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border2);border-radius:20px;padding:4px 10px;font-size:12px;color:var(--muted2);max-width:100%}
.attach-chip button{background:none;border:none;color:var(--muted);cursor:pointer}
.chat-attach{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--r-sm);width:40px;height:40px;font-size:16px;cursor:pointer;flex-shrink:0;color:var(--text)}
.chat-attach:hover{border-color:var(--cyan)}
textarea.chat-text{resize:none;min-height:40px;max-height:140px;line-height:1.4;width:auto}
.msg-file{margin-top:6px;font-size:11.5px;opacity:.75}
.msg-actions{display:flex;gap:6px;margin-top:2px}

.starters{display:flex;flex-wrap:wrap;gap:8px}
.starters button{background:var(--surface2);border:1px solid var(--border2);border-radius:20px;padding:6px 12px;font-size:12.5px;color:var(--muted2);cursor:pointer;font-family:var(--sans)}
.starters button:hover{border-color:var(--cyan);color:var(--text)}
.vid-item{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--border2);border-radius:var(--r-sm);cursor:pointer;font-size:12.5px;color:var(--muted2);margin-top:6px}

.vid-item span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:768px){.msg{max-width:92%}}
.ts-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;display:flex;align-items:center;justify-content:center;padding:1rem}
.ts-card{background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:1.5rem;text-align:center;max-width:360px}
.ts-card p{font-size:13px;color:var(--muted2);margin-bottom:12px}
</style>
</head>
<body>

<!-- ── APP SHELL ────────────────────────────── -->
<header id="appHeader">
  <div class="logo">Wasongah<em>AI</em></div>
  <div class="header-right">
  </div>
</header>

<div class="shell" id="appShell">
  <nav class="sidebar">
    <div class="sidebar-label">Core Tools</div>
    <button class="tool-btn active" onclick="loadTool('chat')" style="--accent:var(--cyan)">
      <div class="tool-icon" style="--icon-bg:var(--cyan-dim)">💬</div><span>Chat</span>
    </button>
    <button class="tool-btn" onclick="loadTool('write')" style="--accent:var(--violet)">
      <div class="tool-icon" style="--icon-bg:var(--violet-dim)">✍️</div><span>Writer</span>
    </button>
    <button class="tool-btn" onclick="loadTool('summarize')" style="--accent:var(--green)">
      <div class="tool-icon" style="--icon-bg:var(--green-dim)">📋</div><span>Summarizer</span>
    </button>
    <button class="tool-btn" onclick="loadTool('translate')" style="--accent:var(--amber)">
      <div class="tool-icon" style="--icon-bg:var(--amber-dim)">🌍</div><span>Translator</span>
    </button>
    <div class="sidebar-label">Advanced</div>
    <button class="tool-btn" onclick="loadTool('code')" style="--accent:var(--pink)">
      <div class="tool-icon" style="--icon-bg:var(--pink-dim)">💻</div><span>Code Helper</span>
    </button>
    <button class="tool-btn" onclick="loadTool('image')" style="--accent:var(--orange)">
      <div class="tool-icon" style="--icon-bg:var(--orange-dim)">🖼️</div><span>Image</span>
    </button>
    <button class="tool-btn" onclick="loadTool('imagegen')" style="--accent:var(--pink)">
      <div class="tool-icon" style="--icon-bg:var(--pink-dim)">🎨</div><span>Image Creator</span>
    </button>
    <button class="tool-btn" onclick="loadTool('video')" style="--accent:var(--cyan)">
      <div class="tool-icon" style="--icon-bg:var(--cyan-dim)">🎬</div><span>Video</span>
    </button>
    <button class="tool-btn" onclick="loadTool('ideas')" style="--accent:var(--red)">
      <div class="tool-icon" style="--icon-bg:var(--red-dim)">🚀</div><span>Idea Engine</span>
    </button>
    <button class="tool-btn" onclick="loadTool('email')" style="--accent:var(--violet)">
      <div class="tool-icon" style="--icon-bg:var(--violet-dim)">📧</div><span>Email Crafter</span>
    </button>
    <div style="flex:1"></div>
  </nav>
  <main class="main" id="mainArea"></main>
</div>

<script>
// ── CONFIG ───────────────────────────────────────────────────
// Same-origin by default (server serves this page). Override with localStorage 'wasongah_backend' if hosted separately.
const BACKEND = localStorage.getItem('wasongah_backend') || '';

// ── STATE ────────────────────────────────────────────────────
let chatHistory = [];
let imgBase64 = null, imgMime = null;
let currentTool = 'chat';

// ── HUMAN CHECK (optional Cloudflare Turnstile, only active if the server enables it) ──
let tsKey = null, tsPending = null;
async function initHuman(){ try{ const c=await (await fetch(`${BACKEND}/api/config`)).json(); tsKey=c.turnstileSiteKey||null }catch{} }
function ensureVerified(){
  if(!tsKey) return Promise.resolve();
  if(tsPending) return tsPending;
  tsPending = new Promise(resolve=>{
    const box=document.createElement('div'); box.className='ts-overlay';
    box.innerHTML='<div class="ts-card"><p>Quick check to keep Wasongah free for everyone</p><div id="tsWidget"></div></div>';
    document.body.appendChild(box);
    const go=()=>window.turnstile.render('#tsWidget',{sitekey:tsKey,callback:async t=>{
      try{ await fetch(`${BACKEND}/api/verify`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:t})}) }catch{}
      box.remove(); tsPending=null; resolve();
    }});
    if(window.turnstile) go(); else { const sc=document.createElement('script'); sc.src='https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit'; sc.onload=go; document.head.appendChild(sc); }
  });
  return tsPending;
}
async function apiFetch(url, opts){
  let r = await fetch(url, opts);
  if (r.status === 401) {
    let j = {}; try{ j = await r.clone().json() }catch{}
    if (j.error === 'verification_required') { await ensureVerified(); r = await fetch(url, opts); }
  }
  return r;
}

// ── API HELPER ───────────────────────────────────────────────
async function api(endpoint, method = 'GET', body = null) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const res = await apiFetch(`${BACKEND}${endpoint}`, opts);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || data.message || 'Request failed');
  return data;
}

// ── TOOL HELPERS ─────────────────────────────────────────────
async function callTool(tool, body) {
  return api(`/api/tools/${tool}`, 'POST', body);
}

// ── TOOL RENDERING ───────────────────────────────────────────
const TOOLS = {
  chat:      {icon:'💬',accent:'var(--cyan)',   iconBg:'var(--cyan-dim)',   title:'Chat',         desc:'Full conversation with streaming responses.'},
  write:     {icon:'✍️',accent:'var(--violet)', iconBg:'var(--violet-dim)', title:'Writer',       desc:'Generate any written content.'},
  summarize: {icon:'📋',accent:'var(--green)',  iconBg:'var(--green-dim)',  title:'Summarizer',   desc:'Summarize any long text.'},
  translate: {icon:'🌍',accent:'var(--amber)',  iconBg:'var(--amber-dim)',  title:'Translator',   desc:'Translate between 20+ languages.'},
  code:      {icon:'💻',accent:'var(--pink)',   iconBg:'var(--pink-dim)',   title:'Code Helper',  desc:'Write, explain, and debug code.'},
  image:     {icon:'🖼️',accent:'var(--orange)', iconBg:'var(--orange-dim)', title:'Image',        desc:'Analyze any image.'},
  imagegen:  {icon:'🎨',accent:'var(--pink)',   iconBg:'var(--pink-dim)',   title:'Image Creator',desc:'Create or edit images from a description.'},
  video:     {icon:'🎬',accent:'var(--cyan)',   iconBg:'var(--cyan-dim)',   title:'Video',        desc:'Turn a description into an animated video.'},
  ideas:     {icon:'🚀',accent:'var(--red)',    iconBg:'var(--red-dim)',    title:'Idea Engine',  desc:'Generate creative ideas.'},
  email:     {icon:'📧',accent:'var(--violet)', iconBg:'var(--violet-dim)', title:'Email Crafter','desc':'Write professional emails.'},
};

function loadTool(key) {
  currentTool = key;
  document.querySelectorAll('.tool-btn').forEach(b => {
    b.classList.remove('active');
    if (b.getAttribute('onclick')?.includes(`'${key}'`)) b.classList.add('active');
  });
  const t = TOOLS[key];
  if (!t) return;
  const main = document.getElementById('mainArea');
  main.innerHTML = `
    <div class="tool-header">
      <div class="tool-header-icon" style="background:${t.iconBg}">${t.icon}</div>
      <div><div class="tool-header-title">${t.title}</div><div class="tool-header-desc">${t.desc}</div></div>
    </div>
    <div id="toolBody" style="flex:1;display:flex;flex-direction:column;overflow:hidden;"></div>`;
  const renders = {chat:renderChat,write:renderWrite,summarize:renderSummarize,translate:renderTranslate,code:renderCode,image:renderImage,video:renderVideo,imagegen:renderImageStudio,ideas:renderIdeas,email:renderEmail};
  renders[key]?.(document.getElementById('toolBody'));
}

function outputArea(container) {
  container.innerHTML = `
    <div class="workspace">
      <div class="input-col" id="inputCol"></div>
      <div class="output-col">
        <div class="output-header">
          <span>Output</span>
          <div style="display:flex;gap:8px;align-items:center">
            <button class="copy-btn" onclick="copyOutput()">Copy</button>
          </div>
        </div>
        <div class="output-content" id="outputContent">
          <div class="out-empty"><div style="font-size:2.5rem;opacity:0.3">✦</div><p>Your result appears here.</p></div>
        </div>
      </div>
    </div>`;
  return {input:document.getElementById('inputCol'), output:document.getElementById('outputContent')};
}

function showLoading(el,text='Processing...'){el.innerHTML=`<div class="out-loading"><div class="loader-ring"></div><div>${text}</div></div>`}
function showResult(el,text){
  el.innerHTML=`<div class="out-result">${formatText(text)}</div>`;
  window._lastOutput=text;
}
function formatText(t){
  const e=x=>x.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return String(t).split(/```[\w+#.-]*\n?/).map((p,i)=>i%2
    ? `<div class="code-block">${e(p.replace(/\n$/,''))}</div>`
    : e(p).replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>').replace(/`([^`\n]+)`/g,'<code class="inline">$1</code>').replace(/\n/g,'<br>')
  ).join('');
}
function copyOutput(){if(window._lastOutput)navigator.clipboard.writeText(window._lastOutput).then(()=>alert('Copied!'))}
function selectChip(el,gid){document.querySelectorAll(`#${gid} .opt-chip`).forEach(c=>c.classList.remove('active'));el.classList.add('active')}

// ── CHAT ─────────────────────────────────────
const CHAT_KEY = 'wasongah_chats_v1', PREF_KEY = 'wasongah_chat_prefs_v1';
const LANGS = ['Auto','English','Kiswahili','Français','Español','Português','Deutsch','العربية','中文','हिन्दी'];
let chatsLoaded = false;
let chats = [], currentChat = null, chatAttach = null, chatAbort = null, chatBusy = false;
let chatPrefs = {web:false, lang:'Auto'};

function loadChats(){
  try{chats=JSON.parse(localStorage.getItem(CHAT_KEY)||'[]')}catch{chats=[]}
  try{chatPrefs=Object.assign({web:false,lang:'Auto'},JSON.parse(localStorage.getItem(PREF_KEY)||'{}'))}catch{}
}
function saveChats(){
  chats.sort((a,b)=>b.updated-a.updated);
  chats=chats.slice(0,50);
  try{localStorage.setItem(CHAT_KEY,JSON.stringify(chats,(k,v)=>k.startsWith('_')?undefined:v))}catch{}
}
function savePrefs(){try{localStorage.setItem(PREF_KEY,JSON.stringify(chatPrefs))}catch{}}
const $ = id => document.getElementById(id);

function renderChat(container) {
  if(!chatsLoaded){loadChats();chatsLoaded=true}
  currentChat = currentChat && chats.includes(currentChat) ? currentChat : (chats[0]||null);
  container.innerHTML = `
    <div class="chat-wrapper" style="position:relative">
      <div class="chat-top">
        <button class="chat-top-btn" onclick="toggleHistory()">☰ History</button>
        <button class="chat-top-btn" onclick="newChat()">＋ New chat</button>
        <span style="flex:1"></span>
        <button class="chat-top-btn" id="webBtn" onclick="toggleWeb()" title="Use Google Search for up-to-date answers">🌐 Web</button>
        <select id="chatLang" onchange="setLang(this.value)" title="Reply language">${LANGS.map(l=>`<option ${l===chatPrefs.lang?'selected':''}>${l}</option>`).join('')}</select>
      </div>
      <div class="hist-panel" id="histPanel" style="display:none"></div>
      <div class="chat-msgs" id="chatMsgs"></div>
      <div class="attach-row" id="attachRow" style="display:none"></div>
      <div class="chat-input-bar">
        <input type="file" id="chatFile" style="display:none" accept="image/*,application/pdf,text/plain,.md,.csv,.json,.txt" onchange="pickChatFile(event)">
        <button class="chat-attach" onclick="$('chatFile').click()" title="Attach an image, PDF or text file">📎</button>
        <textarea class="chat-text" id="chatIn" rows="1" placeholder="Ask anything..." oninput="autosizeChat()" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();chatAction()}"></textarea>
        <button class="chat-send" id="chatSendBtn" onclick="chatAction()">↑</button>
      </div>
    </div>`;
  updateWebBtn(); renderMessages(); updateSendBtn();
}

function autosizeChat(){const t=$('chatIn');if(!t)return;t.style.height='auto';t.style.height=Math.min(t.scrollHeight,140)+'px'}
function updateWebBtn(){const b=$('webBtn');if(b)b.classList.toggle('on',chatPrefs.web)}
function toggleWeb(){chatPrefs.web=!chatPrefs.web;savePrefs();updateWebBtn()}
function setLang(v){chatPrefs.lang=v;savePrefs()}
function updateSendBtn(){const b=$('chatSendBtn');if(!b)return;b.textContent=chatBusy?'■':'↑';b.title=chatBusy?'Stop':'Send'}
function chatAction(){chatBusy?(chatAbort&&chatAbort.abort()):sendChat(false)}

function newChat(){
  if(chatBusy)return;
  currentChat=null;chatAttach=null;renderAttach();
  $('histPanel').style.display='none';renderMessages();$('chatIn')?.focus();
}
function toggleHistory(){
  const p=$('histPanel');if(!p)return;
  if(p.style.display!=='none'){p.style.display='none';return}
  p.innerHTML = chats.length
    ? chats.map(c=>`<div class="hist-item ${c===currentChat?'active':''}" onclick="openChat('${c.id}')"><div style="flex:1;min-width:0"><div class="hist-title">${esc(c.title||'New chat')}</div><div class="hist-date">${timeAgo(c.updated)}</div></div><button class="hist-del" onclick="event.stopPropagation();deleteChat('${c.id}')" title="Delete">✕</button></div>`).join('')+`<button class="hist-clear" onclick="clearChats()">Clear all chats</button>`
    : `<div style="padding:14px;color:var(--muted);font-size:12.5px">No saved chats yet.</div>`;
  p.style.display='block';
}
function openChat(id){if(chatBusy)return;const c=chats.find(x=>x.id===id);if(!c)return;currentChat=c;$('histPanel').style.display='none';renderMessages()}
function deleteChat(id){if(chatBusy)return;chats=chats.filter(c=>c.id!==id);if(currentChat&&currentChat.id===id)currentChat=null;saveChats();$('histPanel').style.display='none';renderMessages();toggleHistory()}
function clearChats(){if(chatBusy||!confirm('Delete all saved chats on this device?'))return;chats=[];currentChat=null;saveChats();$('histPanel').style.display='none';renderMessages()}
function timeAgo(t){const m=Math.floor((Date.now()-t)/60000);if(m<1)return'just now';if(m<60)return m+' min ago';const h=Math.floor(m/60);if(h<24)return h+' h ago';return Math.floor(h/24)+' d ago'}

// ── attachments ──
function pickChatFile(e){
  const f=e.target.files[0];e.target.value='';if(!f)return;
  if(f.size>6*1024*1024){alert('File is too large (max 6 MB).');return}
  const isText=/^text\//.test(f.type)||/\.(txt|md|csv|json)$/i.test(f.name);
  const r=new FileReader();
  r.onload=()=>{
    if(isText){chatAttach={name:f.name,text:String(r.result).slice(0,200000)}}
    else{chatAttach={name:f.name,mime:f.type||'application/octet-stream',data:String(r.result).split(',')[1]}}
    renderAttach();
  };
  isText?r.readAsText(f):r.readAsDataURL(f);
}
function renderAttach(){
  const row=$('attachRow');if(!row)return;
  if(!chatAttach){row.style.display='none';row.innerHTML='';return}
  row.style.display='flex';
  row.innerHTML=`<span class="attach-chip">📎 ${esc(chatAttach.name)} <button onclick="chatAttach=null;renderAttach()" title="Remove">✕</button></span>`;
}

// ── message rendering ──
function msgHtml(m,i,last){
  if(m.role==='user'){
    const files=(m.files||[]).map(n=>`<div class="msg-file">📎 ${esc(n)}</div>`).join('');
    return `<div class="msg user"><div class="msg-name">You</div><div class="msg-bubble">${esc(m.text)}${files}</div></div>`;
  }
  const src=(m.sources||[]).map(s=>{let h='';try{h=new URL(s.uri).hostname.replace(/^www\./,'')}catch{}return `<a href="${esc(s.uri)}" target="_blank" rel="noopener noreferrer">${esc(s.title||h)}</a>`}).join('');
  return `<div class="msg ai"><div class="msg-name">WasongahAI</div><div class="msg-bubble">${formatText(m.text)}</div>`
    +(src?`<div class="src-list"><span>Sources</span>${src}</div>`:'')
    +`<div class="msg-actions"><button onclick="copyMsg(${i},this)">Copy</button>${last?`<button onclick="sendChat(true)">Regenerate</button>`:''}</div></div>`;
}
function renderMessages(){
  const box=$('chatMsgs');if(!box)return;
  const ms=currentChat?currentChat.messages:[];
  if(!ms.length){
    const starters=['Explain something simply','Help me write a message','Plan my day','Summarize a file I attach'];
    box.innerHTML=`<div class="msg ai"><div class="msg-name">WasongahAI</div><div class="msg-bubble">Hello! Ask me anything — questions, writing, code, math, or attach an image or PDF.</div></div>
      <div class="starters">${starters.map(s=>`<button onclick="$('chatIn').value=this.textContent;$('chatIn').focus();autosizeChat()">${s}</button>`).join('')}</div>`;
    return;
  }
  box.innerHTML=ms.map((m,i)=>msgHtml(m,i,i===ms.length-1&&m.role==='assistant')).join('');
  box.scrollTop=box.scrollHeight;
}
function copyMsg(i,btn){const m=currentChat?.messages[i];if(!m)return;navigator.clipboard.writeText(m.text).then(()=>{btn.textContent='Copied';setTimeout(()=>btn.textContent='Copy',1200)})}

// ── API payload ──
function apiMessages(chat){
  // keep total inline data under the request limit: drop oldest attachments first
  let total=0;for(let i=chat.messages.length-1;i>=0;i--){const m=chat.messages[i];if(m._data){const sz=m._data.reduce((a,d)=>a+d.data.length,0);total+=sz;if(total>11e6)delete m._data}}
  return chat.messages.map(m=>{
    let text=m.text+(m._extra?`\n\n${m._extra}`:'');
    if(m.role==='user'&&m.files?.length&&!m._data&&!m._extra)text+=`\n[Attached file: ${m.files.join(', ')}]`;
    if(m._data?.length)return{role:m.role,content:[...m._data.map(d=>({inlineData:{mimeType:d.mimeType,data:d.data}})),{text}]};
    return{role:m.role,content:text};
  });
}

async function sendChat(regen) {
  if (chatBusy) return;
  const input=$('chatIn');
  if(!regen){
    const text=input.value.trim();
    if(!text&&!chatAttach)return;
    if(!currentChat){currentChat={id:'c'+Date.now(),title:'',updated:Date.now(),messages:[]};chats.unshift(currentChat)}
    const m={role:'user',text:text||'Please look at the attached file.'};
    if(chatAttach){
      m.files=[chatAttach.name];
      if(chatAttach.text!==undefined)m._extra=`--- ${chatAttach.name} ---\n${chatAttach.text}`;
      else m._data=[{mimeType:chatAttach.mime,data:chatAttach.data}];
    }
    currentChat.messages.push(m);
    if(!currentChat.title)currentChat.title=(text||chatAttach?.name||'New chat').slice(0,40);
    input.value='';autosizeChat();chatAttach=null;renderAttach();
  } else {
    if(!currentChat)return;
    if(currentChat.messages.at(-1)?.role==='assistant')currentChat.messages.pop();
  }
  const chat=currentChat;
  chat.updated=Date.now();saveChats();
  renderMessages();
  $('histPanel').style.display='none';

  let box=$('chatMsgs');
  const live=document.createElement('div');live.className='msg ai';
  live.innerHTML=`<div class="msg-name">WasongahAI</div><div class="msg-bubble" style="color:var(--muted2)">▋</div>`;
  box.appendChild(live);box.scrollTop=box.scrollHeight;
  const bubble=live.querySelector('.msg-bubble');

  chatBusy=true;chatAbort=new AbortController();updateSendBtn();
  let full='',sources=[],err='';
  try {
    const res=await apiFetch(`${BACKEND}/api/stream`,{
      method:'POST',headers:{'Content-Type':'application/json'},signal:chatAbort.signal,
      body:JSON.stringify({messages:apiMessages(chat),search:chatPrefs.web,language:chatPrefs.lang})
    });
    if(!res.ok){let m='Request failed';try{m=(await res.json()).error||m}catch{}throw new Error(m)}
    const reader=res.body.getReader();const dec=new TextDecoder();let buf='';
    while(true){
      const {done,value}=await reader.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n');buf=lines.pop();
      for(const line of lines){
        if(!line.startsWith('data: '))continue;
        let ev;try{ev=JSON.parse(line.slice(6))}catch{continue}
        if(ev.type==='text'){full+=ev.text;bubble.style.color='';bubble.innerHTML=formatText(full)+'▋';const b=$('chatMsgs');if(b&&b.contains(live)&&b.scrollHeight-b.scrollTop-b.clientHeight<160)b.scrollTop=b.scrollHeight}
        else if(ev.type==='sources')sources=ev.sources||[];
        else if(ev.type==='error')err=ev.message;
      }
    }
  } catch(e){ if(e.name!=='AbortError')err=e.message; }

  chatBusy=false;chatAbort=null;updateSendBtn();
  if(full){
    chat.messages.push({role:'assistant',text:full,sources});
    chat.updated=Date.now();saveChats();
    if(currentChat===chat&&$('chatMsgs'))renderMessages();
    if(err&&currentChat===chat&&$('chatMsgs'))$('chatMsgs').insertAdjacentHTML('beforeend',`<div class="msg ai"><div class="msg-bubble" style="color:#fca5a5">⚠️ ${esc(err)}</div></div>`);
  } else if(live.isConnected){
    live.innerHTML=`<div class="msg-name">WasongahAI</div><div class="msg-bubble" style="color:#fca5a5">⚠️ ${esc(err||'Stopped.')}</div><div class="msg-actions"><button onclick="sendChat(true)">Try again</button></div>`;
  }
}

// ── IMAGE CREATOR ────────────────────────────
let _studioImg = null, _vidImg = null, _lastImage = null, _pendingVideoImage = null;
function readImageFile(file, cb){
  if(!file) return;
  if(file.size>6*1024*1024){ alert('Image is too large (max 6 MB).'); return; }
  const r=new FileReader();
  r.onload=()=>cb({name:file.name,mime:file.type||'image/png',data:String(r.result).split(',')[1],url:String(r.result)});
  r.readAsDataURL(file);
}
function renderImageStudio(c) {
  _studioImg = null;
  const {input,output}=outputArea(c);
  const chips=(id,arr,def=0)=>`<div class="options-row" id="${id}">${arr.map((t,i)=>`<button class="opt-chip ${i===def?'active':''}" onclick="selectChip(this,'${id}')">${t}</button>`).join('')}</div>`;
  input.innerHTML=`
    <div><label>Describe your image</label>
      <textarea id="igPrompt" style="min-height:120px" placeholder="e.g. A Maasai-inspired logo for a coffee shop in Dar es Salaam, warm colours, clean lines"></textarea></div>
    <div><label>Reference photo <span style="text-transform:none;letter-spacing:0;font-weight:400;color:var(--muted)">(optional: edit or restyle it)</span></label>
      <div class="upload-zone" id="igZone" onclick="document.getElementById('igFile').click()">
        <input type="file" id="igFile" accept="image/*" style="display:none" onchange="studioPick(event)">
        <div>Click to upload a photo</div></div>
      <div id="igPrevRow" style="display:none;align-items:center;gap:10px;margin-top:8px">
        <img id="igPrev" class="preview-img" style="max-height:90px;width:auto"/>
        <button class="copy-btn" onclick="studioClear()">Remove</button></div></div>
    <div><label>Style</label>${chips('igS',['None','Photorealistic','3D render','Illustration','Anime','Watercolor','Logo / flat','Poster'])}</div>
    <div><label>Shape</label>${chips('igR',['1:1','16:9','9:16','4:3'])}</div>
    <div><label>Quality</label>${chips('igQ',['Standard','Pro'])}</div>
    <button class="run-btn" id="igBtn" onclick="runImageStudio()">Create Image →</button>`;
  output.innerHTML=`<div class="out-empty"><div style="font-size:2.5rem;opacity:0.3">🎨</div><p>Your image appears here.<br><span style="font-size:12px;color:var(--muted)">Usually 10–30 seconds.</span></p></div>`;
}
function studioPick(e){
  readImageFile(e.target.files[0], img=>{
    _studioImg=img;
    document.getElementById('igPrev').src=img.url;
    document.getElementById('igPrevRow').style.display='flex';
    document.getElementById('igZone').style.display='none';
  });
  e.target.value='';
}
function studioClear(){
  _studioImg=null;
  const r=document.getElementById('igPrevRow'), z=document.getElementById('igZone');
  if(r)r.style.display='none'; if(z)z.style.display='';
}
async function runImageStudio(){
  const prompt=document.getElementById('igPrompt').value.trim();
  const out=document.getElementById('outputContent'), btn=document.getElementById('igBtn');
  if(!prompt){ out.innerHTML=`<div class="out-result" style="color:#fca5a5">Please describe the image you want.</div>`; return; }
  const pick=id=>document.querySelector(`#${id} .active`)?.textContent||'';
  const body={prompt,style:pick('igS'),aspectRatio:pick('igR'),quality:pick('igQ').toLowerCase()};
  if(_studioImg) body.image={data:_studioImg.data,mime:_studioImg.mime};
  btn.disabled=true; btn.textContent='Creating…';
  out.innerHTML=`<div class="out-empty"><div class="spinner"></div><p>Creating your image…</p></div>`;
  try {
    const r=await api('/api/image','POST',body);
    _lastImage={mime:r.mimeType,data:r.data};
    const ext=(r.mimeType.split('/')[1]||'png').replace('jpeg','jpg');
    const src=`data:${r.mimeType};base64,${r.data}`;
    const o=document.getElementById('outputContent'); if(!o) return;
    o.innerHTML=`<div class="out-result"><img src="${src}" style="width:100%;border-radius:10px;display:block"/>
      <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
        <a class="copy-btn" download="wasongah-image.${ext}" href="${src}" style="text-decoration:none">Download</a>
        <button class="copy-btn" onclick="animateLast()">Animate this →</button></div></div>`;
  } catch(e) {
    const o=document.getElementById('outputContent');
    if(o) o.innerHTML=`<div class="out-result" style="color:#fca5a5">⚠️ ${esc(e.message)}</div>`;
  }
  const b=document.getElementById('igBtn'); if(b){b.disabled=false;b.textContent='Create Image →';}
}
function animateLast(){
  if(!_lastImage) return;
  _pendingVideoImage={name:'created image',mime:_lastImage.mime,data:_lastImage.data,url:`data:${_lastImage.mime};base64,${_lastImage.data}`};
  loadTool('video');
}

let _videoTimer = null;
function renderVideo(c) {
  const {input,output}=outputArea(c);
  const chips=(id,arr,def=0)=>`<div class="options-row" id="${id}">${arr.map((t,i)=>`<button class="opt-chip ${i===def?'active':''}" onclick="selectChip(this,'${id}')">${t}</button>`).join('')}</div>`;
  _vidImg=_pendingVideoImage; _pendingVideoImage=null;
  input.innerHTML=`
    <div><label>Describe your video</label>
      <textarea id="vidPrompt" style="min-height:130px" placeholder="e.g. A friendly robot waters plants on a sunny rooftop garden, soft morning light, gentle camera pan"></textarea></div>
    <div><label>Start from a photo <span style="text-transform:none;letter-spacing:0;font-weight:400;color:var(--muted)">(optional: animate it)</span></label>
      <div class="upload-zone" id="vZone" onclick="document.getElementById('vFile').click()">
        <input type="file" id="vFile" accept="image/*" style="display:none" onchange="vidPick(event)">
        <div>Click to upload a photo</div></div>
      <div id="vPrevRow" style="display:none;align-items:center;gap:10px;margin-top:8px">
        <img id="vPrev" class="preview-img" style="max-height:90px;width:auto"/>
        <button class="copy-btn" onclick="vidClear()">Remove</button></div></div>
    <div><label>Style</label>${chips('vS',['None','Cinematic','3D animation','Cartoon','Anime','Realistic','Motion graphics'])}</div>
    <div><label>Format</label>${chips('vR',['16:9','9:16'])}</div>
    <div><label>Length</label>${chips('vD',['4s','6s','8s'],2)}</div>
    <div><label>Quality</label>${chips('vQ',['Fast','Lite','Standard'])}</div>
    <button class="run-btn" id="vidBtn" onclick="runVideo()">Generate Video →</button>
    <div id="vidGallery"></div>`;
  renderGallery();
  output.innerHTML=`<div class="out-empty"><div style="font-size:2.5rem;opacity:0.3">🎬</div><p>Your video appears here.<br><span style="font-size:12px;color:var(--muted)">Generation takes 1–3 minutes.</span></p></div>`;
  if(_vidImg) showVidPrev();
}


function showVidPrev(){
  const p=document.getElementById('vPrev'); if(!p||!_vidImg) return;
  p.src=_vidImg.url; document.getElementById('vPrevRow').style.display='flex'; document.getElementById('vZone').style.display='none';
}
function vidPick(e){ readImageFile(e.target.files[0], img=>{ _vidImg=img; showVidPrev(); }); e.target.value=''; }
function vidClear(){ _vidImg=null; const r=document.getElementById('vPrevRow'),z=document.getElementById('vZone'); if(r)r.style.display='none'; if(z)z.style.display=''; }

async function runVideo() {
  let prompt=document.getElementById('vidPrompt').value.trim();
  const out=document.getElementById('outputContent');
  if(!prompt && !_vidImg){out.innerHTML=`<div class="out-result" style="color:#fca5a5">Please describe the video you want.</div>`;return;}
  if(!prompt) prompt='Bring this image to life with natural, gentle motion.';
  const btn=document.getElementById('vidBtn');
  const pick=id=>document.querySelector(`#${id} .active`)?.textContent||'';
  const body={prompt,style:pick('vS'),aspectRatio:pick('vR'),duration:parseInt(pick('vD')),quality:pick('vQ').toLowerCase()};
  if(_vidImg) body.image={data:_vidImg.data,mime:_vidImg.mime};
  clearTimeout(_videoTimer);
  btn.disabled=true; btn.textContent='Generating…';
  const started=Date.now();
  out.innerHTML=`<div class="out-empty"><div class="spinner"></div><p id="vidStatus">Starting…</p></div>`;
  try {
    const r=await api('/api/video','POST',body);
    const poll=async()=>{
      try {
        const s=await api(`/api/video/status?id=${encodeURIComponent(r.id)}`);
        if(!document.getElementById('vidStatus')&&!s.done) return; // user navigated away
        if(!s.done){
          const el=document.getElementById('vidStatus');
          if(el) el.textContent=`Creating your video… ${Math.round((Date.now()-started)/1000)}s`;
          if(Date.now()-started>10*60*1000) throw new Error('Timed out. Please try again.');
          _videoTimer=setTimeout(poll,8000); return;
        }
        if(s.error) throw new Error(s.error);
        saveVideo({url:s.url,prompt:prompt.slice(0,80),ts:Date.now()});
        showVideo(s.url); renderGallery();
        const b=document.getElementById('vidBtn'); if(b){b.disabled=false;b.textContent='Generate Video →';}
      } catch(e) { vidFail(e); }
    };
    poll();
  } catch(e) { vidFail(e); }
}

function getVideos(){try{return JSON.parse(localStorage.getItem('wasongah_videos_v1')||'[]').filter(v=>Date.now()-v.ts<47*3600*1000)}catch{return[]}}
function saveVideo(v){try{localStorage.setItem('wasongah_videos_v1',JSON.stringify([v,...getVideos()].slice(0,8)))}catch{}}
function renderGallery(){
  const el=document.getElementById('vidGallery');if(!el)return;
  const vs=getVideos();
  el.innerHTML=vs.length?`<label style="margin-top:6px">Recent videos <span style="text-transform:none;letter-spacing:0;font-weight:400;color:var(--muted)">(kept 2 days)</span></label>`+vs.map((v,i)=>`<div class="vid-item" onclick="playVideo(${i})">▶ <span>${esc(v.prompt)}</span><small>${timeAgo(v.ts)}</small></div>`).join(''):'';
}
function showVideo(url){
  const o=document.getElementById('outputContent');if(!o)return;
  o.innerHTML=`<div class="out-result"><video src="${url}" controls autoplay loop playsinline style="width:100%;max-height:70vh;border-radius:10px;background:#000"></video>
    <div style="margin-top:12px"><a class="copy-btn" href="${url}&download=1" style="text-decoration:none;display:inline-block">Download MP4</a></div></div>`;
}
function playVideo(i){const v=getVideos()[i];if(v)showVideo(v.url)}
function vidFail(e){
  const o=document.getElementById('outputContent');
  if(o) o.innerHTML=`<div class="out-result" style="color:#fca5a5">⚠️ ${esc(e.message)}</div>`;
  const b=document.getElementById('vidBtn'); if(b){b.disabled=false;b.textContent='Generate Video →';}
}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

// ── GENERIC TOOL RUNNER ──────────────────────
async function runTool(tool, body, requiredField) {
  if (requiredField && !body[requiredField]) { alert(`Please fill in the required field.`); return; }
  const out = document.getElementById('outputContent');
  showLoading(out, 'Processing...');
  try {
    const r = await callTool(tool, body);
    showResult(out, r.text);
  } catch(err) {
    out.innerHTML = `<div class="out-empty"><p>⚠️ ${err.message}</p></div>`;

}
